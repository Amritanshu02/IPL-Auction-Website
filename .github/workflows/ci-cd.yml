name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check the frontend, MongoDB, authentication, and Socket.IO
        env:
          APP_ORIGIN: http://127.0.0.1:3000
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$APP_ORIGIN/about" --output "$RUNNER_TEMP/frontend.html"
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/frontend.html"
          [[ "$(curl --fail --silent --show-error "$APP_ORIGIN/api/healthz")" == OK ]]

          username="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          signup=$(jq -cn --arg username "$username" \
            '{username: $username, email: ($username + "@example.test"), password: "Compose-smoke-only-123!"}')
          curl --fail --silent --show-error --cookie-jar "$RUNNER_TEMP/cookies.txt" \
            --header 'Content-Type: application/json' --data "$signup" "$APP_ORIGIN/api/signup" \
            | jq -e '.success == true' > /dev/null
          curl --fail --silent --show-error --cookie "$RUNNER_TEMP/cookies.txt" "$APP_ORIGIN/api/user" \
            | jq -e --arg username "$username" '.success and .user.username == $username' > /dev/null

          curl --fail --silent --show-error "$APP_ORIGIN/socket.io/?EIO=4&transport=polling" \
            | jq -Re 'startswith("0") and (.[1:] | fromjson | .sid | type == "string")' > /dev/null

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 80

      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Deploy to Render and Vercel
    needs: ci
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      vars.RENDER_SERVICE_ID != '' && vars.VERCEL_ORG_ID != '' &&
      vars.VERCEL_PROJECT_ID != '' && vars.VERCEL_FRONTEND_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: production
      url: ${{ vars.VERCEL_FRONTEND_URL }}
    concurrency:
      group: ipl-auction-production
      cancel-in-progress: false
    steps:
      - name: Verify that this commit is still at the tip of master
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment because a newer commit is on master.'
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.revision.outputs.deploy == 'true'
        with:
          persist-credentials: false

      - name: Resolve the hosting origins
        if: steps.revision.outputs.deploy == 'true'
        id: hosting
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}
        run: |
          : "${RENDER_API_KEY:?Set the RENDER_API_KEY secret}"
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN secret}"
          frontend_origin=${VERCEL_FRONTEND_URL%/}
          backend_origin=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | jq -er '.serviceDetails.url')
          backend_origin=${backend_origin%/}
          for origin in "$frontend_origin" "$backend_origin"; do
            if [[ ! "$origin" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
              echo 'Hosting URLs must be HTTPS origins without paths.' >&2
              exit 1
            fi
          done
          echo "frontend=$frontend_origin" >> "$GITHUB_OUTPUT"
          echo "backend=$backend_origin" >> "$GITHUB_OUTPUT"

      - name: Deploy the backend commit on Render
        if: steps.revision.outputs.deploy == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_BACKEND_URL: ${{ steps.hosting.outputs.backend }}
        run: |
          deploy_endpoint="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          requested_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          deploy_request=$(jq -cn --arg commit "$GITHUB_SHA" '{commitId: $commit}')
          response_file="$RUNNER_TEMP/render-deploy.json"
          response_code=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' --data "$deploy_request" \
            --output "$response_file" --write-out '%{http_code}' "$deploy_endpoint")

          render_get() {
            curl --fail --silent --show-error --max-time 20 --retry 2 \
              --header "Authorization: Bearer $RENDER_API_KEY" "$@"
          }

          if [[ "$response_code" == 202 ]]; then
            echo 'Render queued this deployment. Waiting for its deployment ID.'
            for ((attempt = 0; attempt < 40; attempt++)); do
              deploy_id=$(render_get --get --data-urlencode "createdAfter=$requested_at" "$deploy_endpoint" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  'first(.[] | .deploy | select(.commit.id == $sha and .trigger == "api") | .id) // empty')
              [[ -z "$deploy_id" ]] || break
              sleep 15
            done
            if [[ -z "$deploy_id" ]]; then
              echo 'Timed out waiting for the queued Render deployment to appear.' >&2
              exit 1
            fi
          else
            deploy_id=$(jq -er '.id' "$response_file")
          fi

          for ((attempt = 0; attempt < 120; attempt++)); do
            deployment=$(render_get "$deploy_endpoint/$deploy_id")
            status=$(jq -er '.status' <<< "$deployment")
            case "$status" in
              live)
                if [[ "$(jq -er '.commit.id' <<< "$deployment")" != "$GITHUB_SHA" ]]; then
                  echo "Render deployment $deploy_id is serving an unexpected commit." >&2
                  exit 1
                fi
                [[ "$(curl --fail --silent --show-error --max-time 20 --retry 5 --retry-all-errors \
                  "$RENDER_BACKEND_URL/healthz")" == OK ]]
                exit 0
                ;;
              deactivated|build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Render deployment $deploy_id finished with status $status." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Render deployment $deploy_id." >&2
          exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.revision.outputs.deploy == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and package the frontend for Vercel
        if: steps.revision.outputs.deploy == 'true'
        env:
          RENDER_BACKEND_URL: ${{ steps.hosting.outputs.backend }}
        run: |
          docker build --target build --tag ipl-auction-frontend-build \
            --build-arg REACT_APP_SOCKET_URL="$RENDER_BACKEND_URL" ./client
          container=$(docker create ipl-auction-frontend-build)
          trap 'docker rm "$container"' EXIT
          mkdir -p client/build
          docker cp "$container:/app/build/." client/build/
          node client/scripts/prepare-vercel-output.mjs

      - name: Install the Vercel CLI
        if: steps.revision.outputs.deploy == 'true'
        run: npm install --global vercel@58.4.4

      - name: Deploy the frontend to Vercel
        if: steps.revision.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel --cwd client deploy --prebuilt --prod --yes

      - name: Verify the hosted frontend, API rewrite, and Socket.IO origin
        if: steps.revision.outputs.deploy == 'true'
        env:
          FRONTEND_ORIGIN: ${{ steps.hosting.outputs.frontend }}
          RENDER_BACKEND_URL: ${{ steps.hosting.outputs.backend }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 \
            "$FRONTEND_ORIGIN/about" --output "$RUNNER_TEMP/hosted-frontend.html"
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/hosted-frontend.html"
          [[ "$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 \
            "$FRONTEND_ORIGIN/api/healthz")" == OK ]]
          curl --fail --silent --show-error --max-time 20 --header "Origin: $FRONTEND_ORIGIN" \
            --dump-header "$RUNNER_TEMP/socket-headers.txt" "$RENDER_BACKEND_URL/socket.io/?EIO=4&transport=polling" \
            | jq -Re 'startswith("0") and (.[1:] | fromjson | .sid | type == "string")' > /dev/null
          tr -d '\r' < "$RUNNER_TEMP/socket-headers.txt" \
            | grep -Fxi "access-control-allow-origin: $FRONTEND_ORIGIN"

      - name: Record the production URLs
        if: steps.revision.outputs.deploy == 'true'
        env:
          FRONTEND_ORIGIN: ${{ steps.hosting.outputs.frontend }}
          RENDER_BACKEND_URL: ${{ steps.hosting.outputs.backend }}
        run: |
          printf 'Frontend: %s\n\nBackend: %s\n' "$FRONTEND_ORIGIN" "$RENDER_BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
